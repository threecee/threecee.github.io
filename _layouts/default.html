<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 760px; margin: 0 auto; padding: 1.5rem; line-height: 1.6; color: #222; }
    header { border-bottom: 1px solid #ddd; padding-bottom: 1rem; margin-bottom: 1.5rem; }
    header .site-title { font-size: 1.4rem; font-weight: 600; text-decoration: none; color: #222; }
    nav { margin-top: 0.5rem; }
    nav a { margin-right: 1rem; text-decoration: none; color: #06c; font-size: 0.95rem; }
    nav a.active { font-weight: 600; color: #222; }
    h1 { font-size: 1.8rem; margin-top: 0; }
    h2 { font-size: 1.3rem; margin-top: 2rem; }
    h3 { font-size: 1.1rem; margin-top: 1.5rem; }
    code { background: #f4f4f4; padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.9em; }
    pre { background: #f4f4f4; padding: 1rem; border-radius: 4px; overflow-x: auto; }
    a { color: #06c; }
    footer { border-top: 1px solid #ddd; padding-top: 1rem; margin-top: 3rem; font-size: 0.9rem; color: #666; }
    footer a { color: #06c; }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1c1e; color: #e5e5e7; }
      header, footer { border-color: #444; }
      header .site-title, nav a.active, h1, h2, h3 { color: #e5e5e7; }
      code, pre { background: #2c2c2e; }
      a, nav a, footer a { color: #5ac8fa; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="site-title">{{ site.title }}</a>
    <nav>
      {% for item in site.nav %}
        <a href="{{ item.url }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>
      Privacy policies:
      {% for item in site.privacy %}
        <a href="{{ item.url }}">{{ item.title }}</a>{% unless forloop.last %} · {% endunless %}
      {% endfor %}
    </p>
    <p>Source: <a href="https://github.com/threecee/threecee.github.io">github.com/threecee/threecee.github.io</a></p>
  </footer>
</body>
</html>
